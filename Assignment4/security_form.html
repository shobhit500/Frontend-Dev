<!DOCTYPE html>
<html>
<head>
  <title>Secure Form Demo</title>
</head>
<body>
  <h2>Secure Login Form</h2>

  <form autocomplete="off">
    <label for="username">Username:</label><br>
    <input type="text" id="username" name="username" required><br><br>

    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" required><br><br>

    <button type="submit">Login</button>
  </form>

  <hr>

  <p><strong>Note:</strong> Disabling <code>autocomplete</code> helps improve security by preventing browsers from storing and auto-filling sensitive data like usernames and passwords. This reduces the risk of unauthorized access, especially on shared or public devices.</p>
</body>
</html>
