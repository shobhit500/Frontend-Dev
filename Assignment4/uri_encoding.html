<!DOCTYPE html>
<html>
<head>
  <title>URI Encoding Demo</title>
</head>
<body>
  <h2>URI Encoding Example</h2>
  <p>Click the link below to search for "HTML & CSS":</p>

  <!-- Encoded URL: space = %20, & = %26 -->
  <a href="https://example.com/search?query=HTML%20%26%20CSS" target="_blank">
    Search for HTML & CSS
  </a>
</body>
</html>
