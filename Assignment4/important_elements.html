<!DOCTYPE html>
<html>
<head>
  <!-- Sets the title of the webpage shown in the browser tab -->
  <title>My Web Page</title>

  <!-- Declares the character encoding for the document -->
  <meta charset="UTF-8">

  <!-- Provides a short description of the page for search engines -->
  <meta name="description" content="This is a sample webpage demonstrating key head elements.">

  <!-- Specifies the author of the document -->
  <meta name="author" content="Shobhit">

  <!-- Sets the base URL for all relative links on the page -->
  <base href="https://example.com/">

  <!-- Links to a favicon or external resource like CSS -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <!-- Internal CSS styles can be written here -->
  <style>
    /* Add your CSS styles here */
  </style>

  <!-- JavaScript code can be written here -->
  <script>
    // Add your JavaScript here
  </script>
</head>
<body>
  <h1>Welcome to My Web Page</h1>
  <p>This page demonstrates all essential &lt;head&gt; elements with comments.</p>
</body>
</html>
