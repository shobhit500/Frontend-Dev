<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Frameset Layout</title>
</head>
<frameset rows="30%,70%">
  <frame src="data:text/html,
    <html>
      <head><title>Navigation</title></head>
      <body>
        <h3>Navigation</h3>
        <p>
          <a href='#'>Home</a> |
          <a href='#'>About</a> |
          <a href='#'>Contact</a>
        </p>
      </body>
    </html>" name="topFrame">
    
  <frame src="data:text/html,
    <html>
      <head><title>Welcome</title></head>
      <body>
        <h2>Welcome to My Website</h2>
      </body>
    </html>" name="bottomFrame">
</frameset>
</html>
