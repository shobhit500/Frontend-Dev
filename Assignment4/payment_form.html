<!DOCTYPE html>
<html>
<head>
  <title>Payment Form</title>
</head>
<body>
  <h2>Payment Form</h2>
  <form>
    <label for="name">Cardholder Name:</label><br>
    <input type="text" id="name" name="name" required><br><br>

    <label for="card">Card Number:</label><br>
    <input type="text" id="card" name="card" required><br><br>

    <label for="expiry">Expiry Date:</label><br>
    <input type="month" id="expiry" name="expiry" required><br><br>

    <label for="cvv">CVV:</label><br>
    <input type="password" id="cvv" name="cvv" maxlength="4" required><br><br>

    <button type="submit">Pay Now</button>
  </form>
</body>
</html>
