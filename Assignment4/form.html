<!DOCTYPE html>
<html>
<head>
  <title>Form Page</title>
</head>
<body>
  <h2>Submit Form</h2>

  <!-- Form targets the iframe named "resultFrame" -->
  <form action="result.html" method="get" target="resultFrame">
    <label for="name">Enter your name:</label><br>
    <input type="text" id="name" name="name" required><br><br>
    <button type="submit">Submit</button>
  </form>

  <hr>

  <!-- Iframe to display the result -->
  <iframe name="resultFrame" width="100%" height="100" style="border:1px solid #ccc;"></iframe>
</body>
</html>
