<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Span elements</title>
</head>
<body>
    <p>
  The <span style="color:green;">forest trail</span> winds gently through the hills, offering a peaceful escape from the city. 
  Be cautious of the <span style="color:red;">steep slopes</span> near the northern ridge, especially after rain. 
  For those interested in wildlife, the area is known for its <span style="color:blue;">rare bird sightings</span> during spring.
</p>
</body>
</html>
