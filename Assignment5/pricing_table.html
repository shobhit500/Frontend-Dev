<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pricing plans</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 40px;
    }

    .pricing-table {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .plan {
      background-color: white;
      border: 2px solid #ccc;
      border-radius: 10px;
      box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
      padding: 30px;
      width: 300px;
      box-sizing: border-box;
      transition: transform 0.3s, background-color 0.3s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .plan:hover {
      transform: scale(1.05);
      background-color: #e6f7ff;
    }

    .popular {
      border: 3px solid #0077b6;
    }

    .plan h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .features {
      list-style: none;
      padding: 0;
      margin-bottom: 20px;
    }

    .features li {
      margin-bottom: 10px;
      text-align: center;
    }

    .price {
      font-size: 1.5em;
      text-align: center;
      margin-bottom: 20px;
      color: #0077b6;
    }

    .plan a {
      text-align: center;
      display: block;
      padding: 10px;
      background-color: #0077b6;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      transition: background-color 0.3s;
    }

    .plan a:hover {
      background-color: #005f8e;
    }

    @media (max-width: 600px) {
      .pricing-table {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>

  <h1 style="text-align:center; margin-bottom:40px;">Choose Your Plan</h1>

  <div class="pricing-table">
    <div class="plan">
      <h2>Basic</h2>
      <ul class="features">
        <li>1 User</li>
        <li>5GB Storage</li>
        <li>Email Support</li>
      </ul>
      <div class="price">₹499/month</div>
      <a href="#">Select Plan</a>
    </div>

    <div class="plan popular">
      <h2>Standard</h2>
      <ul class="features">
        <li>5 Users</li>
        <li>50GB Storage</li>
        <li>Priority Support</li>
      </ul>
      <div class="price">₹999/month</div>
      <a href="#">Select Plan</a>
    </div>

    <div class="plan">
      <h2>Premium</h2>
      <ul class="features">
        <li>Unlimited Users</li>
        <li>200GB Storage</li>
        <li>24/7 Support</li>
      </ul>
      <div class="price">₹1999/month</div>
      <a href="#">Select Plan</a>
    </div>
  </div>

</body>
</html>
