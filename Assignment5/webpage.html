<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Box Model Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      line-height: 1.6;
      color: #333;
    }

    header {
      position: sticky;
      top: 0;
      background: linear-gradient(to right, rgba(0,0,0,0.8), rgba(50,50,50,0.8));
      padding: 10px 0;
      z-index: 1000;
    }

    nav ul {
      display: flex;
      justify-content: center;
      list-style: none;
    }

    nav ul li {
      margin: 0 15px;
    }

    nav ul li a {
      color: white;
      text-decoration: none;
      padding: 5px 10px;
      border: 1px solid transparent;
      outline: 2px solid rgba(255,255,255,0.3);
    }

    #hero {
      background-image: url('https://via.placeholder.com/1200x600');
      background-size: cover;
      background-position: center;
      height: 100vh;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .hero-text {
      color: white;
      text-align: center;
      background: rgba(0,0,0,0.5);
      padding: 30px;
      border: 2px solid white;
      outline: 2px dashed rgba(255,255,255,0.5);
      position: relative;
    }

    #about {
      padding: 50px 20px;
      background: #f4f4f4;
    }

    .about-container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .about-text, .about-image {
      flex: 1;
      padding: 20px;
      border: 1px solid #ccc;
      outline: 1px solid rgba(0,0,0,0.1);
    }

    .about-image img {
      max-width: 100%;
      height: auto;
    }

    #services {
      padding: 50px 20px;
      background: linear-gradient(to bottom, #e0e0e0, #ffffff);
      text-align: center;
    }

    .services-container {
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .service-box {
      background: rgba(0,128,255,0.1);
      border: 2px solid #0080ff;
      outline: 2px dashed rgba(0,128,255,0.3);
      padding: 30px;
      width: 30%;
      margin: 10px;
      position: relative;
    }

    #contact {
      padding: 50px 20px;
      background: #f9f9f9;
    }

    form {
      max-width: 600px;
      margin: auto;
      display: flex;
      flex-direction: column;
    }

    input, textarea {
      margin-bottom: 15px;
      padding: 10px;
      border: 1px solid #ccc;
      outline: 1px solid rgba(0,0,0,0.1);
    }

    button {
      padding: 10px;
      background: rgba(0,128,0,0.7);
      color: white;
      border: none;
      cursor: pointer;
    }

    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 20px;
      position: relative;
    }

    @media (max-width: 768px) {
      .about-container, .services-container {
        flex-direction: column;
        align-items: center;
      }

      .service-box {
        width: 80%;
      }
    }
  </style>
</head>
<body>

  <header>
    <nav>
      <ul>
        <li><a href="#hero">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section id="hero">
    <div class="hero-text">
      <h1>Welcome to Our Site</h1>
      <p>Mastering CSS Layouts</p>
    </div>
  </section>

  <section id="about">
    <div class="about-container">
      <div class="about-text">
        <h2>About Us</h2>
        <p>We specialize in modern web design using CSS Box Model and positioning techniques.</p>
      </div>
      <div class="about-image">
        <img src="https://via.placeholder.com/400x250" alt="About Image" />
      </div>
    </div>
  </section>

  <section id="services">
    <h2>Our Services</h2>
    <div class="services-container">
      <div class="service-box">Design</div>
      <div class="service-box">Development</div>
      <div class="service-box">Consulting</div>
    </div>
  </section>

  <section id="contact">
    <h2>Contact Us</h2>
    <form>
      <input type="text" placeholder="Your Name" required />
      <input type="email" placeholder="Your Email" required />
      <textarea placeholder="Your Message" required></textarea>
      <button type="submit">Send</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2025 CSS Mastery. All rights reserved.</p>
  </footer>

</body>
</html>
