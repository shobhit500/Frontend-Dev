<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Filter Cards with Animation</title>

  
  <link rel="stylesheet" href="filter-cards.css">
</head>

<body>
  <header>
    <h1>Profile Cards with Filters & Animation</h1>
  </header>

  <main>
    <section class="cards-section" aria-labelledby="cards-heading">
      <h2 id="cards-heading">Meet the Team</h2>

      <div class="card-container">

        <article class="card">
          <img src="https://via.placeholder.com/300" alt="Profile Image">
          <h3>John Carter</h3>
          <p>Frontend Developer with a focus on modern UI design.</p>
        </article>

        <article class="card">
          <img src="https://via.placeholder.com/300" alt="Profile Image">
          <h3>Sophia Lane</h3>
          <p>Creative designer specializing in digital illustrations.</p>
        </article>

        <article class="card">
          <img src="https://via.placeholder.com/300" alt="Profile Image">
          <h3>Michael Ray</h3>
          <p>Backend Developer passionate about clean architectures.</p>
        </article>

      </div>
    </section>
  </main>

  <footer>
    <p>Prepared by: &lt;Your Name&gt;</p>
  </footer>
</body>
</html>
