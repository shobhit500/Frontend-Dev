<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="q8.css">
</head>

<body>

    <h1 class="title">Filter Comparison</h1>

    <div class="container">

        <!-- BEFORE IMAGE -->
        <div class="image-box">
            <img src="https://via.placeholder.com/300" alt="">
            <p class="caption">Before</p>
        </div>

        <!-- AFTER IMAGE WITH FILTER -->
        <div class="image-box">
            <img class="filtered" src="https://via.placeholder.com/300" alt="">
            <p class="caption">After (Filtered)</p>
        </div>

    </div>

</body>
</html>
