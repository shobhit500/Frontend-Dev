<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom Dropdown</title>
<link rel="stylesheet" href="customDropdown.css">
</head>
<body>
  <h1>Custom Dropdown</h1>
  <div class="dropdown">
    <button id="dropdownBtn">Select an option</button>
    <ul id="dropdownOptions" class="dropdown-options">
      <li data-value="Option 1">Option 1</li>
      <li data-value="Option 2">Option 2</li>
      <li data-value="Option 3">Option 3</li>
    </ul>
  </div>

  <script src="customDropdown.js"></script>
</body>
</html>
