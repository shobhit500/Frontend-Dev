<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Image Showcase</title>
  <link rel="stylesheet" href="image-showcase.css" />
  <style>
    /* Reset and base styles */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background-color: #f5f5f5;
  color: #333;
  padding: 20px;
  text-align: center;
}

header, footer {
  margin-bottom: 20px;
}

.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
  max-width: 1200px;
  margin: 0 auto;
}

.image-card {
  background-color: #fff;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

.image-wrapper {
  position: relative;
  overflow: hidden;
}

.image-wrapper img {
  width: 100%;
  height: auto;
  display: block;
  transition: transform 0.3s ease-in-out;
}

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0);
  transition: background-color 0.3s ease-in-out;
}

.image-wrapper:hover img {
  transform: scale(1.1);
}

.image-wrapper:hover .overlay {
  background-color: rgba(0, 0, 0, 0.3);
}

figcaption {
  padding: 10px;
  font-size: 1rem;
  background-color: #fff;
}

/* Responsive stacking */
@media (max-width: 700px) {
  .gallery {
    grid-template-columns: 1fr;
  }
}
  </style>
</head>
<body>
  <header>
    <h1>Image Showcase Gallery</h1>
  </header>

  <main>
    <section class="gallery">
      <figure class="image-card">
        <div class="image-wrapper">
          <img src="images/img1.jpg" alt="Nature 1" />
          <div class="overlay"></div>
        </div>
        <figcaption>Peaceful Lake</figcaption>
      </figure>

      <figure class="image-card">
        <div class="image-wrapper">
          <img src="images/img2.jpg" alt="Nature 2" />
          <div class="overlay"></div>
        </div>
        <figcaption>Mountain View</figcaption>
      </figure>

      <figure class="image-card">
        <div class="image-wrapper">
          <img src="images/img3.jpg" alt="Nature 3" />
          <div class="overlay"></div>
        </div>
        <figcaption>Sunset Horizon</figcaption>
      </figure>

      <figure class="image-card">
        <div class="image-wrapper">
          <img src="images/img4.jpg" alt="Nature 4" />
          <div class="overlay"></div>
        </div>
        <figcaption>Forest Trail</figcaption>
      </figure>

      <figure class="image-card">
        <div class="image-wrapper">
          <img src="images/img5.jpg" alt="Nature 5" />
          <div class="overlay"></div>
        </div>
        <figcaption>Ocean Breeze</figcaption>
      </figure>

      <figure class="image-card">
        <div class="image-wrapper">
          <img src="images/img6.jpg" alt="Nature 6" />
          <div class="overlay"></div>
        </div>
        <figcaption>Desert Dunes</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Image Showcase</p>
  </footer>
</body>
</html>
