<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadows and Depth Demo</title>
  <link rel="stylesheet" href="shadows-depth.css" />
</head>
<body>
  <header>
    <h1>Shadows and Depth Effect</h1>
  </header>

  <main class="card-container">
    <section class="card shadow-light">
      <h2>Light Shadow</h2>
      <p>This card uses a subtle shadow for soft depth.</p>
    </section>

    <section class="card shadow-medium">
      <h2>Medium Shadow</h2>
      <p>This card has a moderate shadow for stronger depth.</p>
    </section>

    <section class="card shadow-heavy">
      <h2>Heavy Shadow</h2>
      <p>This card uses a deep shadow for dramatic elevation.</p>
    </section>
  </main>

  <footer>
    <p>Created by Shobhit | CSS Shadows Demo</p>
  </footer>
</body>
</html>
