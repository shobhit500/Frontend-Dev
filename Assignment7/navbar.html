<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navigation Bar with Hover Effects</title>
  <link rel="stylesheet" href="navbar.css">
  <style>
    /* Basic Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Body Styling */
body {
  font-family: Arial, sans-serif;
  background-color: #f4f6f8;
  color: #333;
  line-height: 1.6;
}

/* Navigation Bar Styling */
.navbar {
  background-color: #2c3e50;
  padding: 10px 0;
}

.navbar ul {
  display: flex;
  justify-content: center;
  list-style: none;
  flex-wrap: wrap;
}

/* Nav Links */
.navbar ul li a {
  color: white;
  text-decoration: none;
  padding: 12px 20px;
  display: block;
  border: 1px solid transparent;
  transition: all 0.3s ease;
  font-weight: 500;
  letter-spacing: 0.5px;
}

/* Hover Effects */
.navbar ul li a:hover {
  background-color: #34495e;
  border: 1px solid #1abc9c;
  border-radius: 5px;
  transform: scale(1.05);
}

/* Active Link Highlight */
.navbar ul li a.active {
  background-color: #1abc9c;
  color: #fff;
  border-radius: 5px;
}

/* Responsive: Stack Vertically Below 700px */
@media (max-width: 700px) {
  .navbar ul {
    flex-direction: column;
    align-items: center;
  }

  .navbar ul li a {
    width: 100%;
    text-align: center;
    border-bottom: 1px solid #34495e;
  }
}

/* Main Content Styling */
.content {
  text-align: center;
  margin: 50px auto;
  max-width: 600px;
}

.content h1 {
  color: #2c3e50;
  margin-bottom: 10px;
}

/* Footer Styling */
footer {
  text-align: center;
  background-color: #2c3e50;
  color: #fff;
  padding: 12px 0;
  margin-top: 50px;
  font-size: 0.9rem;
}

  </style>
</head>
<body>
  <header>
    <nav class="navbar">
      <ul>
        <li><a href="#" class="active">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Portfolio</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="content">
      <h1>Welcome to My Website</h1>
      <p>Explore the navigation bar above to see hover transitions and responsiveness in action.</p>
    </section>
  </main>

  <footer>
    <p>Designed by [Your Name] | Navigation Bar Demo</p>
  </footer>
</body>
</html>
