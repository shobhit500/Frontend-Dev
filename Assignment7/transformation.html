<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transformations Showcase</title>
  <link rel="stylesheet" href="transformations.css">
  <style>
    /* Basic Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Page Styling */
body {
  font-family: Arial, sans-serif;
  background-color: #f4f4f9;
  color: #333;
  text-align: center;
  padding: 20px;
}

header h1 {
  margin-bottom: 30px;
}

/* Flexbox Container for Boxes */
.container {
  display: flex;
  justify-content: center;
  gap: 30px;
  flex-wrap: wrap;
}

/* Common Box Styling */
.box {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.shape {
  width: 100px;
  height: 100px;
  background-color: #4a90e2;
  border-radius: 10px;
  transition: all 0.4s ease;
  margin-bottom: 10px;
}

/* Transformations on Hover */
.rotate .shape:hover {
  transform: rotate(45deg);
}

.scale .shape:hover {
  transform: scale(1.3);
}

.translate .shape:hover {
  transform: translate(30px, 20px);
}

.skew .shape:hover {
  transform: skew(20deg, 10deg);
}

/* Label Styling */
p {
  font-weight: bold;
  font-size: 14px;
  color: #555;
}

/* Footer */
footer {
  margin-top: 40px;
  font-size: 13px;
  color: #777;
}
  </style>
</head>
<body>
  <header>
    <h1>CSS Transformations Showcase</h1>
  </header>

  <main>
    <section class="container">
      <!-- Rotate Box -->
      <div class="box rotate">
        <div class="shape"></div>
        <p>rotate(45deg)</p>
      </div>

      <!-- Scale Box -->
      <div class="box scale">
        <div class="shape"></div>
        <p>scale(1.3)</p>
      </div>

      <!-- Translate Box -->
      <div class="box translate">
        <div class="shape"></div>
        <p>translate(30px, 20px)</p>
      </div>

      <!-- Skew Box -->
      <div class="box skew">
        <div class="shape"></div>
        <p>skew(20deg, 10deg)</p>
      </div>
    </section>
  </main>

  <footer>
    <p>Designed by Shobhit Singh | CSS Transformation Demo</p>
  </footer>
</body>
</html>
