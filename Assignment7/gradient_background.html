<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gradient Background Demo</title>
  <link rel="stylesheet" href="gradient-background.css" />
  <style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  color: white;
}

/* Fixed header and footer */
header, footer {
  position: fixed;
  left: 0;
  right: 0;
  padding: 1rem;
  text-align: center;
  background-color: #222;
  z-index: 1000;
}

header {
  top: 0;
}

footer {
  bottom: 0;
}

/* Main content spacing */
main {
  padding-top: 80px;  /* space for fixed header */
  padding-bottom: 60px; /* space for fixed footer */
}

/* Linear gradient section with parallax effect */
.linear-gradient {
  height: 100vh;
  background: linear-gradient(to right, #007BFF, #6f42c1);
  background-attachment: fixed; /* parallax-like effect */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

/* Radial gradient section */
.radial-gradient {
  height: 100vh;
  background: radial-gradient(circle, #FFA500, #FFD700);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
  </style>
</head>
<body>
  <header>
    <h1>Gradient Background Showcase</h1>
  </header>

  <main>
    <section class="linear-gradient">
      <h2>Linear Gradient Section</h2>
      <p>This section uses a linear gradient from blue to purple.</p>
    </section>

    <section class="radial-gradient">
      <h2>Radial Gradient Section</h2>
      <p>This section uses a radial gradient from orange to yellow.</p>
    </section>
  </main>

  <footer>
    <p>Created by Shobhit | CSS Gradient Demo</p>
  </footer>
</body>
</html>
