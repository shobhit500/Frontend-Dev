<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="task-tracker.css">
</head>
<body>

<header class="bg-primary text-white py-3 text-center">
    <h1 class="fw-bold">
        Task Tracker 
        <!-- Badge showing total pending tasks -->
        <span class="badge bg-warning text-dark ms-2">5 Pending</span>
    </h1>
</header>

<main class="container my-5">

    <div class="card shadow-sm p-4">
        <h3 class="mb-3">Your Tasks</h3>

        <!-- List group for tasks -->
        <ul class="list-group">

            <!-- Task 1 -->
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Complete Assignment
                <!-- Priority badge -->
                <span class="badge bg-danger rounded-pill">High</span>
            </li>

            <!-- Task 2 -->
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Prepare Notes for Class
                <span class="badge bg-warning text-dark rounded-pill">Medium</span>
            </li>

            <!-- Task 3 -->
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Organize Files
                <span class="badge bg-success rounded-pill">Low</span>
            </li>

            <!-- Task 4 -->
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Submit Project Report
                <span class="badge bg-danger rounded-pill">High</span>
            </li>

            <!-- Task 5 -->
            <li class="list-group-item d-flex justify-content-between align-items-center">
                Clean Email Inbox
                <span class="badge bg-success rounded-pill">Low</span>
            </li>

        </ul>

        <!-- Completed button -->
        <div class="mt-4 text-end">
            <button class="btn btn-success">
                Completed <span class="badge bg-light text-dark ms-1">2</span>
            </button>
        </div>
    </div>

</main>

<footer class="text-center py-3 bg-light">
    <p class="mb-0">Task Tracker © 2025</p>
</footer>

</body>
</html>
