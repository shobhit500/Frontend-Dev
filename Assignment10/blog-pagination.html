<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Pagination</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="blog-pagination.css">

</head>
<body>

<header class="bg-dark text-white py-4 text-center">
    <h1 class="fw-bold">My Tech Blog</h1>
    <p class="lead">Latest tutorials, articles & updates</p>
</header>

<main class="container my-5">

    <!-- Pagination Section -->
    <nav aria-label="Page navigation example">
        <ul class="pagination justify-content-center">
            <li class="page-item">
                <a class="page-link" href="#">Previous</a>
            </li>

            <li class="page-item"><a class="page-link" href="#">1</a></li>

            <li class="page-item"><a class="page-link" href="#">2</a></li>

            <li class="page-item">
                <a class="page-link" href="#">Next</a>
            </li>
        </ul>
    </nav>

    <!-- Pager Section -->
    <div class="text-center mt-4">

        <button class="btn btn-outline-secondary me-3">
            Older Posts
        </button>

        <button class="btn btn-outline-secondary">
            Newer Posts
        </button>

    </div>

</main>

<footer class="py-3 bg-light text-center">
    © 2025 My Tech Blog — Pagination Example
</footer>

</body>
</html>
