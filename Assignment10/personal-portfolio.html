<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="Q2.css">
</head>

<body class="bg-light text-dark">

    <!-- HEADER SECTION -->
    <header class="text-center mt-4">
        <h1 class="fw-bold">Shobhit Singh</h1>
        <p class="lead mb-3">Aspiring Full Stack Developer</p>
    </header>

    <!-- MAIN PROFILE SECTION -->
    <main>
        <section class="container text-center p-5">
            
            <!-- Profile Image -->
            <!-- .img-fluid makes image responsive, .rounded-circle makes it circular -->
            <img src="https://via.placeholder.com/180" class="img-fluid rounded-circle mb-3" alt="Profile">

            <!-- Buttons -->
            <!-- Bootstrap button utilities -->
            <div class="mb-4">
                <button class="btn btn-primary me-2">Hire Me</button>
                <button class="btn btn-outline-dark">Download CV</button>
            </div>

            <!-- CONTACT FORM -->
            <h3 class="fw-bold mb-3">Contact Me</h3>

            <form class="mx-auto" style="max-width: 400px;">
                <input type="text" class="form-control mb-3" placeholder="Your Name">
                <input type="email" class="form-control mb-3" placeholder="Your Email">
                <textarea class="form-control mb-3" rows="3" placeholder="Message"></textarea>
                <button class="btn btn-success w-100">Send Message</button>
            </form>

        </section>
    </main>

    <!-- FOOTER -->
    <footer class="text-center py-3">
        <p class="mb-0">© 2025 My Portfolio. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
