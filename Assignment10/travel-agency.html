<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Agency Showcase</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="travel-agency.css">

</head>
<body>

<header class="bg-primary text-white text-center py-4">
    <h1 class="fw-bold">Explore The World</h1>
    <p class="lead">Your Journey Begins Here</p>
</header>


<main class="container my-4">

    <!-- Bootstrap Carousel -->
    <div id="travelCarousel" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-inner">

            <!-- Slide 1 -->
            <div class="carousel-item active" data-bs-interval="3000">
                <img src="https://images.unsplash.com/photo-1505765050516-f72dcac9c60e" class="d-block w-100" alt="Beach">
                <div class="carousel-caption d-none d-md-block">
                    <h3 class="fw-bold">Maldives Paradise</h3>
                    <p>Relax in crystal-clear waters.</p>
                </div>
            </div>

            <!-- Slide 2 -->
            <div class="carousel-item" data-bs-interval="4000">
                <img src="https://images.unsplash.com/photo-1505761671935-60b3a7427bad" class="d-block w-100" alt="Mountains">
                <div class="carousel-caption d-none d-md-block">
                    <h3 class="fw-bold">Swiss Alps</h3>
                    <p>Adventure at the top of the world.</p>
                </div>
            </div>

            <!-- Slide 3 -->
            <div class="carousel-item" data-bs-interval="5000">
                <img src="https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1" class="d-block w-100" alt="City">
                <div class="carousel-caption d-none d-md-block">
                    <h3 class="fw-bold">Paris, France</h3>
                    <p>The city of love and lights.</p>
                </div>
            </div>

        </div>

        <!-- Controls -->
        <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>


    <!-- Progress Bar -->
    <section class="my-5">
        <h4 class="text-center mb-3">Booking Progress</h4>

        <div class="progress" style="height: 30px;">
            <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" 
                role="progressbar" 
                style="width: 70%;">
                70% Completed
            </div>
        </div>
    </section>

</main>

<!-- Footer -->
<footer class="bg-dark text-white text-center py-3">
    <p class="mb-1">Travel Agency · +91 98765 43210</p>
    <p class="mb-0">Email: info@travelworld.com</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
