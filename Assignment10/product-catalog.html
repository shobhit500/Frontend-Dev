<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="Q3.css">
</head>

<body class="bg-light">

    <!-- HEADER -->
    <header class="text-center py-4">
        <h1 class="fw-bold">Our Products</h1>
        <p class="text-muted">Browse our latest collection</p>
    </header>

    <!-- PRODUCT GRID -->
    <main class="container">
        <div class="row g-4">

            <!-- PRODUCT 1 -->
            <!-- .col-md-3 = 4 columns on desktop | .col-sm-6 = 2 columns tablet | col-12 = mobile -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold">Product 1</h5>
                        <p class="text-success fw-bold">₹599</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <!-- PRODUCT 2 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold">Product 2</h5>
                        <p class="text-success fw-bold">₹799</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <!-- PRODUCT 3 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold">Product 3</h5>
                        <p class="text-success fw-bold">₹999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <!-- PRODUCT 4 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold">Product 4</h5>
                        <p class="text-success fw-bold">₹1299</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="text-center py-4 mt-4">
        <p class="text-muted">© 2025 Product Catalog – All Rights Reserved</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
