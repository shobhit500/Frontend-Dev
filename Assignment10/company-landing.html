<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startup Landing Page</title>

    <!-- BOOTSTRAP 5 CDN -->
    <!-- CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
        rel="stylesheet">
    
    <!-- CUSTOM CSS -->
    <link rel="stylesheet" href="q1-company-landing.css">
</head>

<body>

<!-- HEADER & NAVBAR -->
<header class="bg-dark text-white py-3">
    <div class="container d-flex justify-content-between align-items-center">
        <h1 class="h3 m-0">TechStart Inc.</h1>

        <!-- Bootstrap Navbar -->
        <!-- .navbar-expand-lg makes navbar responsive -->
        <nav class="navbar navbar-expand-lg navbar-dark">
            <button class="navbar-toggler" type="button" 
                data-bs-toggle="collapse" data-bs-target="#navmenu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navmenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a href="#" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Services</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Contact</a></li>
                </ul>
            </div>
        </nav>
    </div>
</header>

<!-- HERO SECTION -->
<main>
    <section class="hero d-flex align-items-center text-center text-white">
        <div class="container">
            <h1 class="display-4 fw-bold">Innovate. Build. Grow.</h1>
            <p class="lead mb-4">We help startups turn ideas into reality using modern technology.</p>

            <!-- BUTTON USING BOOTSTRAP -->
            <a href="#" class="btn btn-primary btn-lg">Get Started</a>
        </div>
    </section>
</main>

<!-- FOOTER -->
<footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="m-0">&copy; 2025 TechStart Inc. All Rights Reserved.</p>
</footer>

<!-- BOOTSTRAP JS -->
<script 
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
