<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Product Search</title>
<style>
  #results { margin-top: 20px; }
  .product { display: flex; align-items: center; margin-bottom: 10px; }
  .product img { width: 80px; height: 80px; margin-right: 10px; }
  .loading { display: none; font-style: italic; }
  .no-results { color: red; font-weight: bold; }
</style>
</head>
<body>
<h1>Live Product Search</h1>
<input type="text" id="searchBox" placeholder="Search products...">
<div class="loading" id="loading">Loading...</div>
<div id="results"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="liveSearch.js"></script>
</body>
</html>
